name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  dag-import:
    # DAG import 錯誤是 Airflow 最典型的失敗：語法或相依一壞，
    # 排程器就靜靜地不排這條線——UI 上看不到「本來該跑的東西沒跑」。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install "apache-airflow==2.10.4" pymssql pandas
      - name: DAG 可被解析且結構符合預期
        env:
          AIRFLOW__CORE__LOAD_EXAMPLES: "false"
          DW_REPO_ROOT: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import sys
          from airflow.models import DagBag

          bag = DagBag("airflow/dags", include_examples=False)
          if bag.import_errors:
              for f, e in bag.import_errors.items():
                  print(f"{f}\n{e}")
              sys.exit("DAG 匯入失敗")

          # 用 bag.dags 而非 bag.get_dag()：後者會去查 Airflow 中繼資料庫，
          # 在沒跑過 `airflow db migrate` 的 CI 上會炸在 "no such table: dag"。
          # 本機容器有中繼庫所以看不出來——這正是 CI 該抓、而本機抓不到的差異。
          dag = bag.dags.get("credit_dw_etl")
          if dag is None:
              sys.exit("找不到 credit_dw_etl")

          # SCD2 的時序鏈是正確性約束，不是風格——月份任務必須由舊到新串成單鏈。
          # 這條鏈斷掉不會報錯，只會讓維度版本區間錯亂。
          chain = [f"load_month_ix{i}" for i in (6, 5, 4, 3, 2, 1)]
          for upstream, downstream in zip(chain, chain[1:]):
              task = dag.get_task(downstream)
              if upstream not in task.upstream_task_ids:
                  sys.exit(f"SCD2 時序鏈斷裂：{downstream} 的上游不含 {upstream}")

          gate = dag.get_task("quality_gate")
          if "gen_data_dictionary" not in gate.downstream_task_ids:
              sys.exit("品質閘未擋在資料字典之前——髒資料會產出文件")

          fin = dag.get_task("finalize")
          if fin.trigger_rule != "all_done":
              sys.exit(f"finalize 的 trigger_rule 是 {fin.trigger_rule}，"
                       "失敗時不會收尾，dq.load_batch 會留下 RUNNING 殭屍批次")

          print(f"✓ credit_dw_etl 解析成功，{len(dag.tasks)} 個任務，時序鏈與品質閘結構符合")
          PY

  sql-sanity:
    # 綱要腳本必須可重複執行：teardown 順序寫錯（先維度後事實）會被外鍵擋住，
    # 腳本跑到一半失敗後就再也跑不動——這個坑踩過一次，故納入檢查。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: teardown 順序為反依賴
        run: |
          python - <<'PY'
          import re, sys, pathlib
          sql = pathlib.Path("sql/01_schema.sql").read_text(encoding="utf-8")
          # 只看 teardown 區塊：第一個 CREATE TABLE 之後的 DROP 是各表
          # 「DROP…CREATE」配對，與拆除順序無關，混進來會誤判。
          teardown = sql.split("CREATE TABLE")[0]
          drops = re.findall(r"DROP TABLE IF EXISTS\s+(\w+\.\w+)", teardown)
          facts = [i for i, t in enumerate(drops) if "fact_" in t]
          dims = [i for i, t in enumerate(drops) if "dim_" in t]
          if not facts or not dims:
              sys.exit("找不到事實表或維度表的 DROP 敘述")
          if max(facts) > min(dims):
              sys.exit(f"teardown 順序錯誤：事實表必須全部先於維度表被 DROP\n{drops}")
          print(f"✓ teardown 反依賴順序正確（{len(drops)} 張表）")
          PY

  portability:
    # 跨雲可攜的判斷寫鬆或寫緊，症狀都不是「你連錯資料庫了」：
    # 寫緊 → USE 照送，後續 DDL 全部落到另一個資料庫（實跑踩過，錯誤訊息是主鍵重複）；
    # 寫鬆 → 含 USE 字樣的真 DDL 被整批丟掉，綱要少一塊卻毫無錯誤。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install pytest
      - run: python -m pytest tests/ -q

  dbt-project:
    # dbt 專案是同一份倉儲的第三種實作，而且是多引擎的：BigQuery（sandbox）與
    # T-SQL 家族（edge，dbt-fabric 的前置）。這一關不連線（dbt parse 不需要憑證），
    # 但兩個 adapter 各 parse 一次——dispatch macro 少寫一個分支、或 Jinja 只在某個
    # target 下炸掉，單一 adapter 的 parse 是看不到的。
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - adapter: dbt-bigquery
            target: sandbox
          - adapter: dbt-sqlserver
            target: edge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - if: matrix.adapter == 'dbt-sqlserver'
        # pyodbc 匯入時要找 libodbc；parse 不連線，但 adapter 載入這一步就需要它
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends unixodbc
      - run: pip install "${{ matrix.adapter }}>=1.9"
      - name: dbt 專案可解析，且核心模型與測試都在
        working-directory: dbt
        env:
          DBT_PROFILES_DIR: .
        run: |
          cp profiles.yml.example profiles.yml
          sed -i 's/your-gcp-project-id/ci-parse-only/' profiles.yml
          dbt parse --target ${{ matrix.target }}
          dbt list --resource-type model --target ${{ matrix.target }} > /tmp/models.txt
          dbt list --resource-type test  --target ${{ matrix.target }} > /tmp/tests.txt
          python - <<'PY2'
          import sys
          models = open("/tmp/models.txt").read()
          tests = open("/tmp/tests.txt").read()
          for m in ("marts.dim_customer", "marts.fact_monthly_statement",
                    "marts.fact_default_outcome", "staging.stg_monthly_snapshot"):
              if m not in models:
                  sys.exit(f"缺少模型 {m}")
          # 粒度守衛與 SCD2 兩條是倉儲正確性的核心，掉了不會有人發現
          for t in ("unique_combination_of_columns_fact_monthly_statement_client_id__date_key",
                    "scd2_no_overlapping_versions_dim_customer_",
                    "dbt_utils_free_exactly_one_current_dim_customer_",
                    "expect_row_count_fact_monthly_statement_180000"):
              if t not in tests:
                  sys.exit(f"缺少測試 {t}")
          print(f"✓ dbt 專案解析成功；{len(models.strip().splitlines())} 個模型、"
                f"{len(tests.strip().splitlines())} 項測試，核心守衛齊全")
          PY2
