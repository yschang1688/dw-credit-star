name: dw_credit_star
version: "1.0.0"
config-version: 2
profile: dw_credit_star

flags:
  # dbt-sqlserver 的舊版行為會把 +schema 直接當 schema 名——在本專案會撞到
  # 預存程序版既有的 stg／dw。開這個旗標走 dbt 標準串接（target.schema + '_' + 自訂名），
  # 產物落在 dbt_stg／dbt_dw，兩套實作同庫並存、可互相對帳。
  dbt_sqlserver_use_default_schema_concat: True

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# 這個專案是 SQL Server 版倉儲的 BigQuery 對照實作。
# 語意必須一致，實作刻意不同——差異本身就是要展示的東西（見 dbt/README.md）。
models:
  dw_credit_star:
    +persist_docs:
      relation: true
      columns: true
    staging:
      +materialized: view          # 暫存層薄，用 view 省儲存與維護
      +schema: stg
    marts:
      +materialized: table
      +schema: dw

seeds:
  dw_credit_star:
    +schema: dw
    # 中文標籤欄在 T-SQL 家族必須是 NVARCHAR——dbt-sqlserver 預設把字串載成 VARCHAR（非 Unicode），
    # 在預設 collation 下中文會靜默變成問號，而且 seed 照樣回報成功。
    # BigQuery 只有一種 STRING，所以型別依 target 分流。
    dim_date:
      +column_types:
        # bigint 在 BigQuery 是 INT64 的官方別名、在 T-SQL 家族是原生型別——同一個字兩邊通吃
        date_key: bigint
        month_end_date: DATE
        month_name_zh: "{{ 'string' if target.type == 'bigquery' else 'nvarchar(20)' }}"
    dim_sex:
      +column_types:
        sex_desc: "{{ 'string' if target.type == 'bigquery' else 'nvarchar(20)' }}"
    dim_education:
      +column_types:
        education_desc: "{{ 'string' if target.type == 'bigquery' else 'nvarchar(50)' }}"
    dim_marriage:
      +column_types:
        marriage_desc: "{{ 'string' if target.type == 'bigquery' else 'nvarchar(50)' }}"
    dim_payment_status:
      +column_types:
        documented_desc: "{{ 'string' if target.type == 'bigquery' else 'nvarchar(100)' }}"
        common_reading: "{{ 'string' if target.type == 'bigquery' else 'nvarchar(100)' }}"
